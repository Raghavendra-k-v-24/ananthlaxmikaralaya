<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/nama.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08071a" />
    <!-- the site has its own English/Kannada switch; browser auto-translation rewrites the DOM and breaks React -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="Ananth Laxmi Mangal Karalaya, a marriage hall on Station Road, Vijayapura, blessed by Lord Venkateswara. Bride and groom rooms, in-house catering and decoration. Send a booking enquiry for your wedding or function."
    />
    <title>Ananth Laxmi Mangal Karalaya | Marriage Hall in Vijayapura</title>
    <link rel="canonical" href="https://www.ananthlaxmikaralaya.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ananthlaxmikaralaya.in/" />
    <meta property="og:title" content="Ananth Laxmi Mangal Karalaya | Marriage Hall in Vijayapura" />
    <meta property="og:description" content="A marriage hall blessed by Lord Venkateswara, with bride and groom rooms, in-house catering and decoration. Send a booking enquiry." />
    <meta property="og:image" content="https://www.ananthlaxmikaralaya.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EventVenue",
        "name": "Ananth Laxmi Mangal Karalaya",
        "url": "https://www.ananthlaxmikaralaya.in/",
        "telephone": "+91-99168-74924",
        "image": "https://www.ananthlaxmikaralaya.in/og-image.jpg",
        "hasMap": "https://maps.app.goo.gl/Gdp9NN34QD9pGLqa7",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Gyani Garden, Station Road, Chattrapati Shivaji Nagar",
          "addressLocality": "Vijayapura",
          "addressRegion": "Karnataka",
          "postalCode": "586104",
          "addressCountry": "IN"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Separate bride and groom rooms", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Generator backup", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "In-house catering", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "In-house decoration and arrangements", "value": true }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
